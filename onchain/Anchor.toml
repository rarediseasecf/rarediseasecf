[toolchain]
anchor_version = "0.31.1"
# Match official solanafoundation/anchor:v0.31.1 image / Anchor release notes.
# Do NOT use Agave 4.x in Docker Desktop — test-validator panics without io_uring.
solana_version = "2.1.0"

[features]
resolution = true
skip-lint = false

[programs.localnet]
rarediseasecf = "3ChG4eL5EvhrELWbAZs3cdVt8P9X1CfrRwfF6gqfKG9d"

[programs.devnet]
rarediseasecf = "3ChG4eL5EvhrELWbAZs3cdVt8P9X1CfrRwfF6gqfKG9d"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Shell wrapper forces CommonJS under Node 20 (bare npx mocha hits ERR_UNKNOWN_FILE_EXTENSION).
test = "bash ./scripts/run-anchor-tests.sh"

[test]
# Localnet under Docker Desktop can be slow to become RPC-ready.
startup_wait = 20000
