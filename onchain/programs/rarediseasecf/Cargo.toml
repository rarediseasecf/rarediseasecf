[package]
name = "rarediseasecf"
version = "0.1.0"
description = "RareDiseaseCF — campaign metadata + USDC escrow/settlement (Devnet demo)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "rarediseasecf"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []

[dependencies]
anchor-lang = { version = "=0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "=0.31.1", features = ["token", "token_2022", "mint"] }
